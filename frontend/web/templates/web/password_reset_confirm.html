{% extends 'web/base.html' %}

{% block title %}Verificar Código - Sistema de Reservas{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header text-center mb-4">
            <div class="auth-icon">🔢</div>
            <h1 class="card-title">Código de Verificación</h1>
            <p class="card-subtitle">Hemos enviado un código a <strong>{{ email }}</strong></p>
        </div>

        {% if error %}
        <div class="alert alert-danger mb-3">
            <span class="me-2">⚠️</span>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="token" class="form-label">Código de 6 dígitos</label>
                <input type="text" id="token" name="token" class="form-control text-center" 
                       placeholder="000000" maxlength="6" style="letter-spacing: 5px; font-size: 1.5rem;" required>
            </div>

            <hr class="my-3">

            <div class="form-group">
                <label for="password" class="form-label">Nueva Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" 
                       placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" 
                       placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-success btn-block mb-3">
                <span class="me-2">✅</span>
                Cambiar Contraseña
            </button>
        </form>
        
        <div class="text-center">
            <a href="{% url 'password_reset_request' %}" class="btn btn-outline btn-sm">Reenviar código</a>
        </div>
    </div>
</div>

<style>
/* Estilos específicos */
.auth-container {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: linear-gradient(135deg, var(--primary-color), var(--dark-color));
}

.auth-card {
    background: white;
    padding: 3rem;
    border-radius: 16px;
    box-shadow: var(--shadow-hover);
    width: 100%;
    max-width: 440px;
}

.auth-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}
</style>
{% endblock %}
