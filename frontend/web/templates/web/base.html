<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>{% block title %}Sistema de Reservas de Recursos{% endblock %}</title>
    {% load static %}
    <link rel='stylesheet' href='{% static "css/styles.css" %}'>
</head>
<body>
    <div class='header'>
        <div class='nav'>
            <div class='logo'>Sistema de Reservas</div>
            <div class='nav-links'>
                {% if request.session.user %}
                    <span class='user-welcome'>Hola, {{ request.session.user.nombre }}</span>
                    <a href="{% url 'recursos' %}" class='btn btn-outline btn-sm'>📚 Recursos</a>
                    <a href="{% url 'reservas' %}" class='btn btn-outline btn-sm'>📋 Mis Reservas</a>
                    <a href="{% url 'logout' %}" class='btn btn-danger btn-sm'>🚪 Cerrar Sesión</a>
                {% else %}
                    <a href="{% url 'login' %}" class='btn btn-sm'>🔐 Iniciar Sesión</a>
                {% endif %}
            </div>
        </div>
    </div>
    
    <div class='container'>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
